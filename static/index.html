<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone → OSC → Truchet tiles</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; }
    canvas { display: block; width: 100%; height: 100%; }

    /* the little data panel in the corner (press H to hide it) */
    #panel {
      position: fixed; top: 12px; left: 12px; max-width: 300px;
      padding: 9px 12px; border-radius: 8px;
      background: rgba(21, 23, 28, 0.85); color: #c9ced9;
      font: 11px/1.7 ui-monospace, Menlo, Consolas, monospace;
    }
    .row { display: grid; grid-template-columns: 52px 64px 36px; gap: 8px; align-items: center; }
    .track { height: 2px; background: #333946; }
    .fill { height: 100%; background: #c9ced9; }
    .number { text-align: right; }
    summary, .hint { color: #767e90; }
    summary { margin-top: 5px; cursor: pointer; }
    #raw { margin: 2px 0 0; white-space: pre-wrap; color: #9aa2b3; }
    #status { margin-top: 5px; color: #e0b76a; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="panel">
    <div id="values"></div>
    <details>
      <summary>raw OSC messages</summary>
      <pre id="raw"></pre>
    </details>
    <div id="status"></div>
    <div class="hint">H hides this panel</div>
  </div>

  <script src="static/phone.js"></script>   <!-- gets the data  -->
  <script src="static/sketch.js"></script>  <!-- draws the art  -->
</body>
</html>
